{% extends 'base.html' %}
<!-- extends in jinja2 is like include in python -->

{% block content %}
<h2>Login</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form action="/login" method="get">
     <table>
        <tr>
            <td>Username:</td>
            <td><input type="text" name="username"></td>
        </tr>

        <tr>
            <td>Password:</td>
            <td><input type="password" name="password"></td>
        </tr>
    </table>

    <p>
        <input type="submit" value="Log In">
    </p>

</form>
{% endblock %}
