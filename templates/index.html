{% extends 'base.html' %}
<!-- extends in jinja2 is like include in python; this is specific to this page -->

{% block content %}
<h2>Main Page</h2>

<img src="/static/matcha.png" alt="matcha" width="200">

{% for message in messages %}
    <div>
        <p><b>{{ message.username }}</b>, age {{ message.age }}</p>
        <p>{{ message.message }}</p>
        <p>{{ message.created_at }}</p>
    </div>
    <hr>
{% endfor %}

{% endblock %}
