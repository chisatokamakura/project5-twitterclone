{% extends 'base.html' %}

{% block content %}
<h2>Create Message</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form action="/create_message" method="get">
    <p>
        Message:
        <textarea name="message" maxlength="1000"></textarea>
    </p>

    <p>
        <input type="submit" value="Create Message">
    </p>
</form>
{% endblock %}
